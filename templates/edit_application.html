{% extends "base.html" %}

{% block content %}

<h1>Edit Application</h1>

<div class="card">

    <form method="POST">

        <label>Select Job</label>
        <select name="job_id" required>
            {% for job in jobs %}
            <option value="{{ job.job_id }}"
                {% if job.job_id == application.job_id %}selected{% endif %}>
                {{ job.job_title }} - {{ job.company_name }}
            </option>
            {% endfor %}
        </select>

        <label>Application Date</label>
        <input type="date" name="application_date"
               value="{{ application.application_date.strftime('%Y-%m-%d') }}"
               required>

        <label>Status</label>
        <select name="status">
            {% for status in ['Applied', 'Screening', 'Interview',
                              'Offer', 'Rejected', 'Withdrawn'] %}
            <option value="{{ status }}"
                {% if application.status == status %}selected{% endif %}>
                {{ status }}
            </option>
            {% endfor %}
        </select>

        <input type="text" name="resume_version"
               value="{{ application.resume_version or '' }}"
               placeholder="Resume Version">

        <label>
            <input type="checkbox" name="cover_letter_sent"
                   style="display:inline; width:auto;"
                   {% if application.cover_letter_sent %}checked{% endif %}>
            Cover Letter Sent
        </label>

        <textarea name="interview_data"
                  placeholder="Interview notes">{{ application.interview_data or '' }}</textarea>

        <button type="submit">Update Application</button>

    </form>

</div>

{% endblock %}
