
{% extends "base.html" %}

{% block content %}

<h1>Edit Company</h1>

<div class="card">

    <form method="POST">

        <input type="text" name="company_name"
               value="{{ company.company_name }}" required>

        <input type="text" name="industry"
               value="{{ company.industry or '' }}">

        <input type="text" name="website"
               value="{{ company.website or '' }}">

        <input type="text" name="city"
               value="{{ company.city or '' }}">

        <input type="text" name="state"
               value="{{ company.state or '' }}">

        <textarea name="notes"
                  placeholder="Company Notes">{{ company.notes or '' }}</textarea>

        <button type="submit">Update Company</button>

    </form>

</div>

{% endblock %}
